# Opt-in web-model LLM route: run a signed-in ChatHub site as a text-only
# tool-calling model behind the harness agent loop. Mount it together with the
# ChatHub host layer, which owns the browser, the login state, and the per-page
# turn queue:
#   dsh web --patch packages/experimental/chathub-host/cordis.patch.yml \
#           --patch packages/experimental/llm-chathub/cordis.patch.yml
#
# The adapter registers one LLM route per configured site (`<site>-chathub` by
# default) and opens a fresh site conversation per attempt, so a retry never
# appends to the previous page. Nothing here launches a browser of its own.
#
# Environment inputs (every one optional):
#   DSH_CHATHUB_LLM_SITE     default site provider (default `deepseek-web`)
#   DSH_CHATHUB_LLM_SITES    comma-separated sites to mount as one route each;
#                            overrides DSH_CHATHUB_LLM_SITE when set
#                            (e.g. `deepseek-web,qianwen-web`)
#   DSH_CHATHUB_LLM_MODEL    model id each route advertises (default `web-model`)
#   DSH_CHATHUB_LLM_ROOT     absolute workspace root path arguments must stay
#                            under (default: the host process's cwd)
#   DSH_CHATHUB_LLM_TOOLS    comma-separated tool whitelist, matched against the
#                            tools the caller mounts without regard to case
#                            (default `read,grep,glob,edit,write,bash`). The
#                            shipped names already cover a caller that
#                            capitalizes: `Read`, `Write`, `Edit`, `Bash`,
#                            `Glob`, `Grep` all pass. Set this only to narrow
#                            the set — a name with no mounted tool is inert.
#   DSH_CHATHUB_LLM_VERIFY   comma-separated verification commands stated in the
#                            prompt's project block (default `pnpm run typecheck`)
#   DSH_CHATHUB_LLM_AUXILIARY  `refuse` (default) or `allow`: whether auxiliary
#                            calls other than compaction (session titles, …) may
#                            spend a site turn. Refusing keeps the title request
#                            from being read by the site as the task; point those
#                            callers at an API route instead. Compaction is
#                            always served: its checkpoint output IS the
#                            caller's result, and without it every model switch
#                            fails on a web-only mount.
#   DSH_CHATHUB_LLM_PROMPT_LOG  path of a JSONL tape recording every rendered
#                            prompt (what the site actually read); unset keeps
#                            the tape off
#   DSH_CHATHUB_LLM_ANSWER_LOG  path of a JSONL tape recording every raw site
#                            answer with its parse verdict (the bytes behind a
#                            rejection, not just the reason); unset keeps the
#                            tape off
#   DSH_CHATHUB_LLM_SELECTION  `auto` (default) or `fixed`. With two or more
#                            mounted sites, `auto` also registers one aggregate
#                            route (default id `web-auto-chathub`) that picks a
#                            site per turn: a topic keeps its site, a new topic
#                            takes the least busy one, and a paced or failing
#                            site is skipped instead of waited out. The
#                            per-site routes stay pinned either way.
#   DSH_CHATHUB_LLM_SELECTION_STRATEGY  `sticky` (default) or `round-robin`
#   DSH_CHATHUB_LLM_FAILOVER  extra sites one turn may try after a site-level
#                            failure (default 1); 0 disables failover
#   DSH_CHATHUB_LLM_REPAIRS  correction rounds after a reply breaks the call
#                            protocol (default 2); each round is a fresh site
#                            conversation with the original prompt plus one
#                            correction, so raising this raises turn latency
#   DSH_CHATHUB_LLM_TOPIC_TTL_MS  how long a topic keeps its site (default
#                            1800000 = 30 min)
#   DSH_CHATHUB_LLM_SITE_COOLDOWN_MS  how long a failed site stays out of
#                            rotation (default 600000 = 10 min)
#   DSH_CHATHUB_LLM_ESCALATE_AFTER  consecutive failures before a topic moves
#                            to a stronger site, and before a repeatedly failing
#                            site is benched (default 2); 0 disables escalation
#   DSH_CHATHUB_LLM_SITE_DEMOTE_MS  how long a site that failed
#                            ESCALATE_AFTER turns in a row stays benched
#                            (default 1800000 = 30 min)
#   DSH_CHATHUB_LLM_SITE_RANK  capability order used for escalation, as
#                            `site:rank` pairs (default ships qianwen 10,
#                            deepseek/glm/doubao 20, chatgpt/gemini 30)
#   DSH_CHATHUB_LLM_PROSE_REPLAY  whether a plain-prose reply before any tool
#                            has run on the topic replays on the next site
#                            (default `true`); the last prose is still
#                            delivered when every site declines
#   DSH_CHATHUB_LLM_CONTEXT_WINDOW  declared context window in tokens used by
#                            harness compaction (default 128000). Must stay
#                            above the session compaction headroom — 65536 by
#                            default — or every model switch fails with
#                            `leaving no pressure budget`.
- insert:
    - id: llm-chathub
      name: '@deepseek-ai/dsh-experimental-llm-chathub'
      config:
        site: !!js process.env.DSH_CHATHUB_LLM_SITE ?? 'deepseek-web'
        sites: !!js (process.env.DSH_CHATHUB_LLM_SITES ?? '').split(',').filter(Boolean)
        model: !!js process.env.DSH_CHATHUB_LLM_MODEL ?? 'web-model'
        contextWindow: !!js Number(process.env.DSH_CHATHUB_LLM_CONTEXT_WINDOW ?? 128000)
        workspaceRoot: !!js process.env.DSH_CHATHUB_LLM_ROOT ?? process.cwd()
        allowTools: !!js (process.env.DSH_CHATHUB_LLM_TOOLS ?? 'read,grep,glob,edit,write,bash').split(',').map(tool => tool.trim()).filter(Boolean)
        verifyCommands: !!js (process.env.DSH_CHATHUB_LLM_VERIFY ?? 'pnpm run typecheck').split(',')
        auxiliary: !!js process.env.DSH_CHATHUB_LLM_AUXILIARY ?? 'refuse'
        selection: !!js process.env.DSH_CHATHUB_LLM_SELECTION ?? 'auto'
        selectionStrategy: !!js process.env.DSH_CHATHUB_LLM_SELECTION_STRATEGY ?? 'sticky'
        autoRoute: !!js process.env.DSH_CHATHUB_LLM_AUTO_ROUTE ?? 'web-auto-chathub'
        stickyTtlMs: !!js Number(process.env.DSH_CHATHUB_LLM_TOPIC_TTL_MS ?? 1800000)
        siteCooldownMs: !!js Number(process.env.DSH_CHATHUB_LLM_SITE_COOLDOWN_MS ?? 600000)
        failoverAttempts: !!js Number(process.env.DSH_CHATHUB_LLM_FAILOVER ?? 1)
        repairAttempts: !!js Number(process.env.DSH_CHATHUB_LLM_REPAIRS ?? 2)
        escalateAfterFailures: !!js Number(process.env.DSH_CHATHUB_LLM_ESCALATE_AFTER ?? 2)
        siteDemoteMs: !!js Number(process.env.DSH_CHATHUB_LLM_SITE_DEMOTE_MS ?? 1800000)
        siteRank: !!js |
          Object.fromEntries(
            (process.env.DSH_CHATHUB_LLM_SITE_RANK ?? '')
              .split(',')
              .filter(Boolean)
              .map((pair) => {
                const [site, rank] = pair.split(':')
                return [site.trim(), Number(rank)]
              }),
          )
        proseReplay: !!js process.env.DSH_CHATHUB_LLM_PROSE_REPLAY !== 'false'

# Compaction policy note: the compaction-basic row this layer once patched here
# is the host-plane row the web bundle disables (`disabled: true`). The instance
# that actually serves a session is instantiated from the agent preset
# (`preset-standard` and friends) at session time, and profile overlays cannot
# reach it. Compaction headroom therefore stays at the preset default (65536),
# and the adapter keeps its declared context window above it instead — see
# DSH_CHATHUB_LLM_CONTEXT_WINDOW above.
